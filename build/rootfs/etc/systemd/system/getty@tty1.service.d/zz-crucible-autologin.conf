# tty1 自動登入 root 並直接進入 crucible-autostart。
#
# 檔名的 zz- 前綴不可拿掉：live-config 會在開機時於
# /run/systemd/generator/getty@tty1.service.d/live-config_autologin.conf
# 產生自己的 drop-in (--autologin user)。systemd 依檔名排序套用 drop-in，
# 後者覆蓋前者 —— 叫 autologin.conf 會排在 live-config_autologin.conf 前面
# 而被整個蓋掉，開機後停在 live-config 的 user 帳號 shell，選碟畫面永遠不出現。
# 這是 QEMU 端到端測試抓到的。
# tty2-tty6 維持一般 getty，供現場以 dmesg / lsblk / wipefs 診斷。
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --skip-login --login-program /usr/local/sbin/crucible-autostart tty1 $TERM
Type=idle
