# Legacy BIOS 開機路徑
UI menu.c32
PROMPT 0
TIMEOUT 100
DEFAULT crucible

MENU TITLE NAS_CRUCIBLE

LABEL crucible
    MENU LABEL NAS_CRUCIBLE - 燒機測試
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components noeject

LABEL crucible-compat
    MENU LABEL NAS_CRUCIBLE - 相容模式 (關閉 KMS)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components noeject nomodeset
