# UEFI 開機路徑 (含 Secure Boot：shim -> grub -> Debian 官方簽章 kernel)
set default=0
set timeout=10

# boot=live 是必要的：live-boot 靠它掛載 squashfs，
# lib/device_probe.sh 的 is_live_environment 也靠它認出自己在 Live 之中。
menuentry "NAS_CRUCIBLE - 燒機測試" {
    linux /live/vmlinuz boot=live components noeject nomodeset=0
    initrd /live/initrd.img
}

# fbterm 需要 KMS framebuffer。伺服器的 BMC 顯示卡 (ASPEED 等) 若不相容，
# 用這一項開機，crucible-autostart 會退回純 tty (中文變方塊但仍可操作)。
menuentry "NAS_CRUCIBLE - 相容模式 (關閉 KMS)" {
    linux /live/vmlinuz boot=live components noeject nomodeset
    initrd /live/initrd.img
}
